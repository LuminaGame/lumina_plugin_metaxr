name: metaxr_example
description: "Bring-up app for lumina_plugin_metaxr passthrough on a Quest: an XR_FB_passthrough underlay under the openxr plugin's frame loop."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_filament:
    git:
      url: https://github.com/LuminaGame/lumina.git
      path: flutter_filament
      ref: 87ca08bec43927031cb16a4297336d4d96389e35
  vector_math: ^2.1.4
  lumina_plugin_openxr:
    git:
      url: https://github.com/LuminaGame/lumina_plugin_openxr.git
      ref: 6fcce400236cb05c8929641f18b80b4820da2b75
  lumina_plugin_metaxr:
    path: ../

dev_dependencies:
  flutter_lints: ^6.0.0

hooks:
  user_defines:
    flutter_filament:
      filament_dir: ../filament
    flutter_assimp:
      filament_dir: ../filament
      libcxx_dir: ../../lumina/flutter_filament/third_party/libcxx
    flutter_riglogic:
      libcxx_dir: ../../lumina/flutter_filament/third_party/libcxx
      riglogic_lib_dir: ../../tools/flutter_riglogic/third_party/openriglogic/lib

flutter:
  uses-material-design: true
