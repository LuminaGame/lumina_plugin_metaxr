name: lumina_plugin_metaxr
description: "Meta Quest OpenXR SDK plugin for Lumina Studio: mixed reality passthrough, 26-joint hand tracking, spatial anchors, scene perception, and social face/eye tracking."
version: 0.2.0
publish_to: none
repository: https://github.com/LuminaGame/lumina_plugin_metaxr

environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  lumina_plugin_openxr:
    git:
      url: https://github.com/LuminaGame/lumina_plugin_openxr.git
      ref: 7eeaae0f619fcce922b95163005b425a98be84cd
  lumina_plugin_process:
    git:
      url: https://github.com/LuminaGame/lumina.git
      path: lumina_plugin_process
      ref: 8fa19e2fa8eecc66da5630053a1c6dd4f0c43033
  lumina_editor_api:
    git:
      url: https://github.com/LuminaGame/lumina.git
      path: lumina_editor_api
      ref: 8fa19e2fa8eecc66da5630053a1c6dd4f0c43033
  lumina:
    git:
      url: https://github.com/LuminaGame/lumina.git
      path: lumina
      ref: 8fa19e2fa8eecc66da5630053a1c6dd4f0c43033
  flutter_filament:
    git:
      url: https://github.com/LuminaGame/lumina.git
      path: flutter_filament
      ref: 8fa19e2fa8eecc66da5630053a1c6dd4f0c43033
  vector_math: ^2.1.4
  meta: ^1.15.0
  logging: ^1.2.0
  ffi: ^2.1.2
  hooks: ^1.0.0
  code_assets: ^1.0.0
  native_toolchain_c: ^0.17.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.24.0
  lumina_smoke:
    git:
      url: https://github.com/LuminaGame/tools.git
      path: lumina_smoke
      ref: 7f6b46c8379ae61e5dc80fe243eddf41b3ac8f3e

hooks:
  user_defines:
    flutter_filament:
      filament_dir: filament
    flutter_assimp:
      filament_dir: filament
      libcxx_dir: ../lumina/flutter_filament/third_party/libcxx
    flutter_riglogic:
      libcxx_dir: ../lumina/flutter_filament/third_party/libcxx
      riglogic_lib_dir: ../tools/flutter_riglogic/third_party/openriglogic/lib

flutter:
